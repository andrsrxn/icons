pre-commit:
  commands:
    format:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,mdx,yaml,yml,html}'
      run: pnpm exec prettier --write {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    lint:
      run: pnpm turbo run lint:check
    type:
      run: pnpm turbo run type:check
    test:
      run: pnpm turbo run test:check
