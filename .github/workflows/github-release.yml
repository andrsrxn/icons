name: GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract changelog section
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          
          # Extract the section from CHANGELOG.md
          awk -v ver="## $VERSION" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > patch_changes.md

          # FALLBACK CHECK: If the file is empty or only contains whitespace
          if [ ! -s patch_changes.md ] || ! grep -q '[^[:space:]]' patch_changes.md; then
            echo "### Release $GITHUB_REF_NAME" > patch_changes.md
            echo "See the automated changelog below for a full list of changes." >> patch_changes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: patch_changes.md
          generate_release_notes: true
