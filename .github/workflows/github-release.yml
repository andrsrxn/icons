name: GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog section
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v ver="## $VERSION" '
            $0 == ver { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > patch_changes.md

      - name: Get previous tag
        id: prev
        run: |
          PREV=$(git tag --sort=-creatordate | grep -v "^${GITHUB_REF_NAME}$" | head -n 1)
          echo "tag=$PREV" >> "$GITHUB_OUTPUT"

      - name: Fetch "What's Changed" from GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/releases/generate-notes" \
            -f tag_name="${GITHUB_REF_NAME}" \
            -f previous_tag_name="${{ steps.prev.outputs.tag }}" \
            --jq .body > whats_changed.md

      - name: Combine into final release notes
        run: cat patch_changes.md whats_changed.md > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release_notes.md
